# Site settings
title: "Caffeine Overdose Calculator"
title_short: "CaffCalc"
description: "Calculate your safe caffeine intake based on personal factors. Know your safe limits and avoid dangerous caffeine consumption."
url: "https://caffcalc.com"
baseurl: ""

# Author
author:
  name: "Ivan Ushakovsky"
  role: "Founder and editor, CaffCalc"
  job_title: "Software Engineer"
  short_bio: "Software engineer. Built CaffCalc after working out that the 400 mg figure everyone repeats isn't one number for everyone. Not a medical professional — every figure here is sourced so you can check it."
  url: "https://caffcalc.com/pages/about/"
  github: "https://github.com/IUshakovsky"
email: "hello@caffcalc.com"

# Build settings
markdown: kramdown
permalink: pretty

# Pagination v2
pagination:
  enabled: true
  per_page: 10
  permalink: '/page/:num/'
  title: ':title - Page :num'
  limit: 0
  sort_field: 'date'
  sort_reverse: true

plugins:
  - jekyll-paginate-v2
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - .DS_Store
  - .git
  - .gitignore
  - .github
  - BLOG_GUIDE.md
  - documentation

# Collections
collections:
  pages:
    output: true
    permalink: /pages/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""
    values:
      layout: "default"

# SEO settings
google_analytics: "G-GC8Z5975WV"

# Navigation
navigation:
  - title: "Calculator"
    url: /
    icon: "calculator"
  - title: "Blog"
    url: /blog
    icon: "newspaper"
  - title: "Caffeine Science"
    url: /pages/caffeine-science
    icon: "flask-conical"
  - title: "Overdose Symptoms"
    url: /pages/overdose-symptoms
    icon: "triangle-alert"
  - title: "Health Advice"
    url: /pages/health-advice
    icon: "heart-pulse"

# Social media
og_image: "assets/images/caffeine-calculator-social.jpg"
twitter_image: "assets/images/caffeine-calculator-social.jpg"

# Performance
sass:
  style: compressed
