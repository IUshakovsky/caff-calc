name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      indexnow_all:
        description: "Submit every sitemap URL to IndexNow, not just changed ones"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          
      - name: Save the live sitemap for IndexNow
        run: curl -sfL https://caffcalc.com/sitemap.xml -o old-sitemap.xml || true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4
        
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      - name: Keep sitemaps for IndexNow
        run: |
          mkdir -p indexnow
          cp _site/sitemap.xml indexnow/new-sitemap.xml
          [ -f old-sitemap.xml ] && cp old-sitemap.xml indexnow/ || true

      - name: Upload sitemaps
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-sitemaps
          path: indexnow/
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download sitemaps
        uses: actions/download-artifact@v4
        with:
          name: indexnow-sitemaps
          path: indexnow/

      - name: Submit new and changed pages
        run: python3 scripts/indexnow.py indexnow/old-sitemap.xml indexnow/new-sitemap.xml ${{ inputs.indexnow_all && '--all' || '' }}
