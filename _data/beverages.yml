# Sourced caffeine figures: the single source of truth for the calculator
# (via assets/data/beverages.json), the homepage table (B10) and the
# "caffeine in X" pages (C13). Validate with: python3 scripts/check-beverages.py
#
# Rules (see documentation/caffcalc-implementation-brief.md, task C12):
#   - No entry ships without source_url + verified. If a figure cannot be
#     checked against a manufacturer label, USDA FoodData Central or the
#     brand's own nutrition page, the entry is left out.
#   - Where a source publishes a range, record the range (caffeine_mg_low /
#     caffeine_mg_high), never an average. The calculator counts the top of
#     the range, the conservative choice for a safety tool.
#   - USDA entries record the per-100 g figure (usda_mg_per_100g) and each
#     serving's weight in grams (size_g), both from FoodData Central, so the
#     per-serving number can be recomputed: round(per_100g * size_g / 100).
#
# Fields:
#   slug, brand (null for generic), product, category, servings[], source_name,
#   source_url, verified, notes (optional), featured (optional: shown in the
#   homepage table), usda_mg_per_100g (USDA entries only).
#   servings[]: label (optional), size_oz, size_ml, size_g (optional),
#   caffeine_mg OR caffeine_mg_low + caffeine_mg_high, default (optional: the
#   headline serving; otherwise the first one is used).
#
# Categories: coffee, tea, energy-drink, energy-shot, soda, chocolate,
#   supplement, medicine, other.

# ---------------------------------------------------------------------------
# Coffee: generic (USDA FoodData Central / FDA)
# ---------------------------------------------------------------------------

