# Sourced caffeine figures. Start of task C12; the homepage table (B10) renders
# from this file. The calculator still reads assets/data/caf_src.json until the
# full C12 migration.
#
# Rules (see documentation/caffcalc-implementation-brief.md):
#   - No entry ships without source_url + verified.
#   - Where a brand publishes a range, record the range (caffeine_mg_low/high),
#     do not average it.
#   - Generic entries use the FDA's published figures rather than a single
#     manufacturer label, because no such label exists for "a cup of coffee".

- slug: brewed-coffee
  brand: null
  product: "Brewed coffee (generic)"
  category: coffee
  servings:
    - size_oz: 8
      size_ml: 237
      caffeine_mg_low: 80
      caffeine_mg_high: 100
  source_name: "FDA, Spilling the Beans: How Much Caffeine is Too Much?"
  source_url: "https://www.fda.gov/consumers/consumer-updates/spilling-beans-how-much-caffeine-too-much"
  verified: 2026-09-18
  notes: "The FDA's own working figure for one cup. Real cups vary widely with grind, dose and brew time."

